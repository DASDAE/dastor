# Keep SHA-pinned GitHub Actions up to date.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Wait a week before adopting a new release in case it gets yanked.
    cooldown:
      default-days: 7
    # Bundle all action bumps into one monthly PR.
    groups:
      github-actions:
        patterns:
          - "*"
