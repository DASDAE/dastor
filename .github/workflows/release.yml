# Publish to PyPI when a GitHub release is published.
#
# Uses PyPI trusted publishing (OIDC), so no token is stored. One-time setup:
# on PyPI, add a trusted publisher for project `dastor` with owner `DASDAE`,
# repository `dastor`, workflow `release.yml`, and environment `pypi`; then
# create a GitHub environment named `pypi` in the repository settings.
name: Release
on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false

      - name: build
        run: uv build

      - name: check distributions
        run: uvx twine check --strict dist/*

      # The release tag (with or without a leading "v") must match the
      # version in src/dastor/__init__.py, so a mistyped tag can't publish.
      - name: check tag matches version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(uvx --from hatch hatch version)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package version $version"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  # Publishing runs in its own job so only this job gets the OIDC token.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dastor/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
