# Publish to PyPI when a GitHub release is published.
#
# Uses PyPI trusted publishing (OIDC), so no token is stored. One-time setup:
# on PyPI, add a trusted publisher for project `dastor` with owner `DASDAE`,
# repository `dastor`, workflow `release.yml`, and environment `pypi`; then
# create a GitHub environment named `pypi` in the repository settings.
name: Release
on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: false

      - name: build
        run: uv build

      - name: check distributions
        run: uvx twine check --strict dist/*

      # The release tag (with or without a leading "v") must match the
      # version in src/dastor/__init__.py, so a mistyped tag can't publish.
      - name: check tag matches version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(uvx --from hatch hatch version)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package version $version"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  # Publishing runs in its own job so only this job gets the OIDC token.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dastor/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: dist
          path: dist/

      - name: publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
