[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dastor"
dynamic = ["version"]
description = "Experimental server for distributed acoustic sensing (DAS) data built on DASCore."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Derrick Chambers" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    # The first DASCore build with the ARROW format; no release has it
    # yet, so this installs only from DASCore's dev branch (see README).
    "dascore>=0.1.24.dev589",
    "fastapi>=0.115",
    "pyarrow>=19",
    "pydantic>=2.7",
    "pyyaml>=6",
    "uvicorn>=0.32",
]

[project.scripts]
dastor = "dastor.cli:main"

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=8",
    "ruff>=0.15",
    "websocket-client>=1.9.2",
]

[tool.hatch.version]
path = "src/dastor/__init__.py"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The browser tests need Chromium; run them with `pytest -m browser`.
addopts = "-m 'not browser'"
markers = ["browser: drives the viewer in a headless Chromium"]

# DASCore's dev branch carries the spool index features dastor builds on.
[tool.uv.sources]
dascore = { git = "https://github.com/DASDAE/dascore", branch = "dev" }
