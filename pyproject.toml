[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dastor"
version = "0.0.1"
description = "Experimental server for distributed acoustic sensing (DAS) data built on DASCore."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Derrick Chambers" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []
